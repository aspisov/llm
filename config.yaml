# Training Configuration for CS336 Basics Transformer

# Model architecture
model:
  vocab_size: 10000
  context_length: 256
  num_layers: 4
  d_model: 512
  num_heads: 32
  d_ff: 1344
  rope_theta: 10000

# Training parameters
training:
  max_lr: 0.001
  min_lr: 0.00001
  warmup_iters: 100
  cosine_cycle_iters: 20001
  betas: [0.9, 0.95]
  weight_decay: 0.01
  num_iterations: 20001
  batch_size: 32
  val_frequency: 500
  max_l2_norm: 10

# Data paths
data:
  train_path: "data/TinyStories-train.npz"
  val_path: "data/TinyStories-valid.npz"

# Checkpointing
checkpoints:
  initial_checkpoint: "outputs/checkpoints/checkpoint_iter_12500.pt"
  checkpoints_path: "outputs/checkpoints"
  checkpoint_frequency: 2500

# Hardware
hardware:
  device: "cuda"
  dtype: "bfloat16"